<!doctype html>
<!--
  =============================================================================
  Machine Learning — トップページ
  =============================================================================

  【このファイルの目的】
    各ラボへの入口だけを提供する。ラボ名を縦に並べるのみで、内容の説明は置かない。
    詳細は各ラボのページ側で読ませる方針のため、ここに解説を足さないこと。

  【構成の規約】
    ラボは1つにつき1ディレクトリとし、その中で完結させる。

        /                        このページ
        /langevin-score-lab/     拡散モデルの score を粒子で可視化
        /transformer-lab/        （準備中）

    各ラボは自前の index.html / app.js / style.css を持ち、
    他のラボやこのページの CSS に依存しない。

  【背景の粒子場について】
    particle-field.js が描く装飾で、情報は持たない（aria-hidden）。
    このサイトの主題が拡散過程であることを、文字を増やさずに示すために置いている。
    読み込みに失敗してもページの機能は損なわれない。

  【リンクについて】
    ディレクトリへのリンクは末尾スラッシュ付きの相対パス（例 "langevin-score-lab/"）
    とする。GitHub Pages はディレクトリ直下の index.html を返すため、
    プロジェクトページのサブパス配信下でも正しく解決される。
    未作成のラボはリンクにせず、準備中であることだけを示す。
  =============================================================================
-->
